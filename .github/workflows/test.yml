name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python evals/run_submission.py --include-optional --output /tmp/submission-evaluation.json
      - run: python evals/run_lesson15.py --output /tmp/lesson15-acceptance.json
      - run: python evals/run_guardrail_attacks.py

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.cloud.yml config --quiet
        env:
          IMAGE_TAG: ${{ github.sha }}
          NOVAOPS_RELEASE_SHA: ${{ github.sha }}
      - run: bash -n deploy/aws/deploy.sh deploy/aws/verify.sh deploy/aws/destroy.sh
      - run: docker compose build
        env:
          IMAGE_TAG: ci-${{ github.sha }}
